name: Go

on:
  push:
    branches: [ "main", "codex/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Vet
      run: go vet ./...

    - name: Repeat A2A tests
      run: go test -count=20 ./clients/a2a ./bridges/a2a

  race:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Race tests
      run: go test -race ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Fuzz archive extraction
      run: |
        go test ./internal/engine -run=^$ -fuzz=FuzzExtractZip -fuzztime=30s
        go test ./internal/engine -run=^$ -fuzz=FuzzExtractTar -fuzztime=30s
        go test ./internal/engine -run=^$ -fuzz=FuzzSniffArchiveFormat -fuzztime=30s
