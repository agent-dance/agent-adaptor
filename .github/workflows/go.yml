name: Go

on:
  push:
    branches: [ "main", "codex/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# All automatic jobs are hermetic. Paid suites require their build tag plus
# an explicit environment opt-in on a separately authorized runner.
env:
  AGENT_ADAPTOR_LIVE_CONFORMANCE: "0"
  AGENT_ADAPTOR_E2E: "0"
  AGENT_ADAPTOR_UPDATE_API_GOLDEN: "0"
  GOTOOLCHAIN: local

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -count=1 -timeout=15m -v ./...

    - name: Vet
      run: go vet ./...

    - name: Vulnerability scan
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

    - name: Run hermetic provider tests with live build tags (paid probes disabled)
      env:
        AGENT_ADAPTOR_LIVE_CONFORMANCE: "0"
      run: |
        go test -count=1 -timeout=10m -tags=claude_live ./claude
        go test -count=1 -timeout=10m -tags=codebuddy_live ./codebuddy
        go test -count=1 -timeout=10m -tags=codex_live ./codex/...
        go test -count=1 -timeout=10m -tags=cursor_live ./cursor

    - name: Parse all persistent-process BDD features (no live execution)
      run: go test -count=1 -timeout=2m -tags=e2e ./e2e -run TestPersistentProcessBDDFeaturesParse

    - name: Driver conformance and architecture contracts
      run: |
        go test -count=1 -timeout=5m ./adaptertest .
        go test -count=1 -timeout=5m ./claude ./codebuddy ./codex ./cursor -run 'Test(Claude|CodeBuddy|Codex|Cursor)DriverConformance'

    - name: S1 through S9
      run: go test -count=1 -timeout=5m . ./bridges/a2a ./hosttools/a2adelegation -run 'TestScenarioS[1-9]|TestServiceTeamCollaborationS9'

    - name: Repeat Thread, Event, Approval and A2A tests
      run: go test -count=20 -timeout=30m . ./clients/a2a ./bridges/a2a ./hosttools/a2adelegation

  race:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Race tests
      run: go test -race -count=1 -timeout=20m ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Fuzz archive extraction
      run: |
        go test ./internal/engine -run=^$ -fuzz=FuzzExtractZip -fuzztime=30s -timeout=2m
        go test ./internal/engine -run=^$ -fuzz=FuzzExtractTar -fuzztime=30s -timeout=2m
        go test ./internal/engine -run=^$ -fuzz=FuzzSniffArchiveFormat -fuzztime=30s -timeout=2m

    - name: Fuzz provider protocol parsers
      run: |
        go test ./claude -run='^$' -fuzz='^FuzzClaudeBatchParser$' -fuzztime=30s -timeout=2m
        go test ./cursor -run='^$' -fuzz='^FuzzCursorBatchParser$' -fuzztime=30s -timeout=2m
        go test ./codebuddy -run='^$' -fuzz='^FuzzCodeBuddyBatchParser$' -fuzztime=30s -timeout=2m
        go test ./codex -run='^$' -fuzz='^FuzzCodexBatchParser$' -fuzztime=30s -timeout=2m

    - name: Fuzz Codex app-server decoders
      run: |
        go test ./codex/appserver -run='^$' -fuzz='^FuzzCodexAppserverNotificationDecoder$' -fuzztime=30s -timeout=2m
        go test ./codex/appserver -run='^$' -fuzz='^FuzzDecodeThreadItem$' -fuzztime=30s -timeout=2m

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
    - name: Record native platform
      shell: pwsh
      run: |
        go version
        go env GOOS GOARCH GOROOT
        $PSVersionTable
        if ((go env GOOS) -ne "windows") { throw "Native Windows execution is required" }
    - name: Full native Windows suite (paid probes disabled)
      run: go test -count=1 -timeout=15m -v ./...
    - name: Windows ownership, process and argument contracts
      shell: pwsh
      run: |
        go test -count=1 -timeout=5m -v ./internal/hostedprofile ./internal/processx ./internal/clihelper ./internal/systemprompt ./adaptertest
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        go test -count=1 -timeout=2m -tags=e2e ./e2e -run TestPersistentProcessBDDFeaturesParse
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Run provider suites with all live build tags and closed environment gate
      shell: pwsh
      run: |
        go test -count=1 -timeout=10m "-tags=claude_live,codebuddy_live,codex_live,cursor_live" ./claude ./codebuddy ./codex/... ./cursor
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Repeat independent profile concurrency on native Windows
      shell: pwsh
      run: |
        go test -count=20 -timeout=10m -v . -run '^TestAlignmentProfileDistinctIdentitiesRunIndependently$'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          examples/web-chat/aguiclient/web/package-lock.json
          examples/web-chat/copilotkit/web/package-lock.json

    - name: Install AG-UI client dependencies
      run: npm ci
      working-directory: examples/web-chat/aguiclient/web

    - name: Build AG-UI client
      run: npm run build
      working-directory: examples/web-chat/aguiclient/web

    - name: Audit AG-UI production dependencies
      run: npm audit --omit=dev --audit-level=high
      working-directory: examples/web-chat/aguiclient/web

    - name: Audit all AG-UI dependencies including build tools
      run: npm audit --audit-level=high
      working-directory: examples/web-chat/aguiclient/web

    - name: Install CopilotKit dependencies
      run: npm ci
      working-directory: examples/web-chat/copilotkit/web

    - name: Lint CopilotKit frontend
      run: npm run lint
      working-directory: examples/web-chat/copilotkit/web

    - name: Build CopilotKit frontend
      run: npm run build
      working-directory: examples/web-chat/copilotkit/web
      env:
        COPILOTKIT_TELEMETRY_DISABLED: "true"

    - name: Audit CopilotKit production dependencies
      run: npm audit --omit=dev --audit-level=high
      working-directory: examples/web-chat/copilotkit/web

    - name: Audit all CopilotKit dependencies including build tools
      run: npm audit --audit-level=high
      working-directory: examples/web-chat/copilotkit/web
